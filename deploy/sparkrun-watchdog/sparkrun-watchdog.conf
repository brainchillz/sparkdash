# sparkrun-watchdog configuration (KEY=VALUE). See /usr/local/bin/sparkrun-watchdog.
CLUSTER=default
ENDPOINT=http://127.0.0.1:8000
SSH_USER=nvidia
SSH_KEY=/home/nvidia/.ssh/id_ed25519_shared
STARTUP_GRACE_MIN=30
PROBE_TIMEOUT=120
FAIL_THRESHOLD=2
RESTART_COOLDOWN_MIN=40
AUTO_RESTART=1
CLEAR_CACHE=1
# Leave WEBHOOK_URL empty to reuse SparkDash's configured alert webhook.
WEBHOOK_URL=
WEBHOOK_STYLE=
