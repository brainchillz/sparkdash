# SparkDash cluster configuration.
#
# Copy this to one of (searched in order):
#   $SPARKDASH_CONFIG
#   ~/.config/sparkdash/config.toml
#   <repo>/sparkdash.toml
# and fill in your own nodes. With no config file, SparkDash runs single-node
# against localhost.

ssh_user = "nvidia"           # SSH user shared across the cluster nodes
sparkrun_cluster = "default"  # sparkrun saved-cluster name

# One [[nodes]] block per machine.
#   ip    - management address; must match the host keys that
#           `sparkrun cluster monitor` reports for this node
#   rdma  - optional fast-copy address (e.g. a direct-connect link) used for
#           model mirroring; set equal to ip if you have no separate link
#   local - true on the single node where SparkDash actually runs (the head)
[[nodes]]
name  = "head"
ip    = "head.example"
rdma  = "head.example"
role  = "head"
local = true

[[nodes]]
name  = "worker"
ip    = "worker.example"
rdma  = "worker.example"
role  = "worker"
local = false

# Extra Subject Alternative Names for the auto-generated self-signed TLS cert,
# so browsers accept the hostnames/addresses you use to reach the dashboard.
[cert]
hostnames = ["localhost"]
ips       = ["127.0.0.1"]

# Optional: run the model canary (a real tiny chat completion with a
# coherence check) on a timer, seconds. 0 or absent = manual only (admin UI).
#canary_interval = 900

# Optional: single sign-on against a Nexus SSO issuer. Setting this here
# fixes the decision at install time (the admin UI can only report it);
# leaving it out lets an admin enroll from Settings with a one-time code.
# The local password login always keeps working.
#[sso]
#issuer   = "https://sso.example.net"
#pubkey   = "<base64url Ed25519 public key from the issuer's /sso/jwks>"
#kid      = "<key id from /sso/jwks>"
#audience = "<the id this install was registered under at the issuer>"
## Issuer subject that signs in as this install's admin account. Default:
## the local admin username. Set when the fleet identity differs (e.g. the
## issuer account is "admin" but SparkDash's local account is "sparkadmin").
#subject  = "admin"
#auto_redirect = false

# Optional: POST a short message on state transitions (healthy <-> degraded,
# model changed, node offline). style = "json" posts {title, message, ts};
# style = "ntfy" posts a plain-text body with a Title header; style = "gchat"
# posts {"text": ...} for a Google Chat space's incoming webhook.
# Normally set from the admin UI (Settings -> Push Alerts); a block here
# fixes it at install time and makes the UI read-only.
#[alerts]
#webhook_url = "https://ntfy.example.net/sparkdash"
#style       = "ntfy"

# Optional: engine stacks — inference engines launched outside sparkrun by an
# operator script (e.g. a hand-tuned vLLM build, one container per node).
# SparkDash detects the stack from its container-name prefix on every node,
# shows it as the owner of the serving port, drives it with
# `command start|stop|restart` (start must block until healthy and exit
# non-zero otherwise; stop must remove every container), streams the script's
# output into the operation panel, refuses to start a recipe on top of it (and
# vice versa), and the watchdog guards it like a recipe. One block per stack.
#[[stacks]]
#name    = "glm53k"                        # short id
#label   = "GLM-5.3-Flash (knapcio TP4)"   # shown in the UI
#command = "/usr/local/bin/glm"            # start|stop|restart (keep it outside any home directory)
#prefix  = "glm53k-"                       # container-name prefix on every node
#model   = "glm-5.3-flash"                 # served model name (informational)
#head    = "glm53k-r0"                     # container to stream logs from (default <prefix>r0)

# Optional: auto-recovery watchdog (default: enabled, managed from the admin
# UI). Setting `enabled` here locks it. See README "Watchdog".
#[watchdog]
#enabled = true
#interval = 60                 # seconds between checks
#fail_threshold = 2            # consecutive failing checks before acting
#startup_grace_min = 30        # a fresh engine may take this long to answer /health
#restart_cooldown_min = 40     # minimum gap between automatic restarts
#auto_restart = true           # false = alert only

# Optional: launch watch. A start/restart from the admin UI follows the vLLM
# serve log and serve PID inside the head container (not just /health), so a
# launch that died or hung is reported with the log excerpt instead of
# waiting out a fixed timeout. See README "Launch watch".
#[launch]
#stall_min = 10                # no serve-log output for this long + /health failing = hung
#max_min = 45                  # ceiling for a launch that keeps logging (cold loads)

# Optional: other SparkDash installs to summarise on the front page.
#[[peers]]
#name = "pebbless"
#url  = "https://pebbles.example.net:7862"
