# SparkDash cluster configuration.
#
# Copy this to one of (searched in order):
#   $SPARKDASH_CONFIG
#   ~/.config/sparkdash/config.toml
#   <repo>/sparkdash.toml
# and fill in your own nodes. With no config file, SparkDash runs single-node
# against localhost.

ssh_user = "nvidia"           # SSH user shared across the cluster nodes
sparkrun_cluster = "default"  # sparkrun saved-cluster name

# One [[nodes]] block per machine.
#   ip    - management address; must match the host keys that
#           `sparkrun cluster monitor` reports for this node
#   rdma  - optional fast-copy address (e.g. a direct-connect link) used for
#           model mirroring; set equal to ip if you have no separate link
#   local - true on the single node where SparkDash actually runs (the head)
[[nodes]]
name  = "head"
ip    = "head.example"
rdma  = "head.example"
role  = "head"
local = true

[[nodes]]
name  = "worker"
ip    = "worker.example"
rdma  = "worker.example"
role  = "worker"
local = false

# Extra Subject Alternative Names for the auto-generated self-signed TLS cert,
# so browsers accept the hostnames/addresses you use to reach the dashboard.
[cert]
hostnames = ["localhost"]
ips       = ["127.0.0.1"]

# Optional: run the model canary (a real tiny chat completion with a
# coherence check) on a timer, seconds. 0 or absent = manual only (admin UI).
#canary_interval = 900

# Optional: single sign-on against a Nexus SSO issuer. Setting this here
# fixes the decision at install time (the admin UI can only report it);
# leaving it out lets an admin enroll from Settings with a one-time code.
# The local password login always keeps working.
#[sso]
#issuer   = "https://sso.example.net"
#pubkey   = "<base64url Ed25519 public key from the issuer's /sso/jwks>"
#kid      = "<key id from /sso/jwks>"
#audience = "<the id this install was registered under at the issuer>"
## Issuer subject that signs in as this install's admin account. Default:
## the local admin username. Set when the fleet identity differs (e.g. the
## issuer account is "admin" but SparkDash's local account is "sparkadmin").
#subject  = "admin"
#auto_redirect = false

# Optional: POST a short message on state transitions (healthy <-> degraded,
# model changed, node offline). style = "json" posts {title, message, ts};
# style = "ntfy" posts a plain-text body with a Title header.
#[alerts]
#webhook_url = "https://ntfy.example.net/sparkdash"
#style       = "ntfy"

# Optional: other SparkDash installs to summarise on the front page.
#[[peers]]
#name = "pebbless"
#url  = "https://pebbles.example.net:7862"
